name: Release

# Jobs opt into the permissions they need.
permissions: {}

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

jobs:
  resolve_tag:
    name: Resolve Release Tag
    # Only release from the CI run triggered by the tag push itself. CI also runs
    # for the branch push and pull requests on the same commit, which would
    # otherwise start duplicate release builds.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      tag_name: ${{ steps.tag.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve v* tag at commit
        id: tag
        shell: bash
        env:
          PUSHED_REF: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          tag_name=""
          if [[ "${PUSHED_REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
            [ "$(git rev-parse -q --verify "refs/tags/${PUSHED_REF}^{commit}")" = "${HEAD_SHA}" ]; then
            tag_name="${PUSHED_REF}"
          else
            echo "No stable release tag found for this CI run."
          fi
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"

  create_release:
    name: Create Draft Release
    needs:
      - resolve_tag
    if: needs.resolve_tag.outputs.tag_name != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.resolve_tag.outputs.tag_name }}
        run: |
          gh release view "${TAG_NAME}" --repo "${GH_REPO}" >/dev/null 2>&1 || \
          gh release create "${TAG_NAME}" --repo "${GH_REPO}" --title "${TAG_NAME}" --generate-notes --draft

  build:
    name: Build Stable ${{ matrix.platform_name }}
    needs:
      - resolve_tag
      - create_release
    if: needs.resolve_tag.outputs.tag_name != ''
    runs-on: ${{ matrix.os }}
    # Builds run dependency lifecycle scripts, so they only get read access.
    # Assets are handed to publish_release as workflow artifacts.
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_name: macOS
            build_command: bun run electron:build:mac
          - os: windows-latest
            platform_name: Windows
            build_command: bun run electron:build:win
          - os: ubuntu-latest
            platform_name: Linux
            build_command: bun run electron:build:linux

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set stable package version
        shell: bash
        env:
          TAG_NAME: ${{ needs.resolve_tag.outputs.tag_name }}
        run: |
          stable_version="${TAG_NAME#v}"
          jq --arg version "${stable_version}" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Build app
        run: ${{ matrix.build_command }}

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          while IFS= read -r file; do
            case "$(basename "$file")" in
              builder-debug.yml)
                continue
                ;;
            esac
            cp "$file" release-assets/
          done < <(find release -maxdepth 1 -type f | sort)

          if [ -z "$(ls -A release-assets)" ]; then
            echo "No release files found"
            exit 1
          fi
          ls -la release-assets

      - name: Upload release assets artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-${{ matrix.platform_name }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 3

  publish_release:
    name: Publish Release
    needs:
      - resolve_tag
      - build
    if: needs.resolve_tag.outputs.tag_name != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
          sparse-checkout: scripts

      # Download each platform by exact name: a pattern download succeeds with
      # whatever artifacts still exist, so an expired macOS or Windows artifact
      # would otherwise let a Linux-only re-run publish an incomplete release.
      - name: Download macOS release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-macOS
          path: release-parts/macOS

      - name: Download Windows release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-Windows
          path: release-parts/Windows

      - name: Download Linux release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-Linux
          path: release-parts/Linux

      - name: Verify all platform assets are present
        run: >-
          node scripts/verify-release-assets.mjs
          --channel latest
          --out release-assets
          macOS=release-parts/macOS
          Windows=release-parts/Windows
          Linux=release-parts/Linux

      - name: Upload assets and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.resolve_tag.outputs.tag_name }}
        run: |
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(find release-assets -maxdepth 1 -type f | sort)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No release files found"
            exit 1
          fi

          gh release upload "${TAG_NAME}" "${files[@]}" --repo "${GH_REPO}" --clobber
          gh release edit "${TAG_NAME}" --repo "${GH_REPO}" --draft=false
