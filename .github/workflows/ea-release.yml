name: EA Release

# Jobs opt into the permissions they need.
permissions: {}

on:
  # Batch changes into one EA release every three hours (UTC).
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

# Publish one EA release at a time. Never cancel a run that is in progress: it
# may own a draft release. A newer pending run replaces an older pending one,
# which has not created anything yet.
concurrency:
  group: ea-release
  cancel-in-progress: false

jobs:
  verify_ci:
    name: Check Changes and Verify CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    outputs:
      release_sha: ${{ steps.changes.outputs.release_sha }}
      should_release: ${{ steps.changes.outputs.should_release }}

    steps:
      - name: Require main branch
        shell: bash
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "EA releases can only be created from main."
            exit 1
          fi

      - name: Check for changes since the last published EA
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Resolve main after acquiring the concurrency slot so queued runs
          # batch the newest changes instead of releasing stale event SHAs.
          release_sha="$(gh api "repos/${GH_REPO}/commits/main" --jq .sha)"
          echo "release_sha=${release_sha}" >> "${GITHUB_OUTPUT}"

          # Drafts (including failed builds) and stable releases are not an EA
          # baseline. Paginate so older EAs remain visible after many releases.
          latest_ea_tag="$(
            gh api --paginate --slurp "repos/${GH_REPO}/releases?per_page=100" |
              jq -r '[.[][] | select(.draft == false and .prerelease == true) | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+-ea\\.[0-9]+$"))] | sort_by(.published_at) | last | .tag_name // empty'
          )"

          if [ -n "${latest_ea_tag}" ]; then
            # Resolve the actual tag: target_commitish can be a branch name.
            published_sha="$(gh api "repos/${GH_REPO}/commits/${latest_ea_tag}" --jq .sha)"
            if [ "${published_sha}" = "${release_sha}" ]; then
              echo "should_release=false" >> "${GITHUB_OUTPUT}"
              echo "No changes since ${latest_ea_tag}; skipping EA release." | tee -a "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
          fi

          echo "should_release=true" >> "${GITHUB_OUTPUT}"
          echo "New changes at ${release_sha}; checking CI before creating an EA release." | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Check CI succeeded for this commit
        if: steps.changes.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ steps.changes.outputs.release_sha }}
        run: |
          conclusion="$(
            gh run list \
              --repo "${GH_REPO}" \
              --workflow=ci.yml \
              --branch=main \
              --event=push \
              --commit="${SHA}" \
              --json conclusion,status \
              --jq 'first | select(.status == "completed") | .conclusion // empty'
          )"

          if [ "${conclusion}" != "success" ]; then
            echo "CI has not completed successfully for commit ${SHA} (conclusion: ${conclusion:-none})."
            exit 1
          fi

          echo "CI succeeded for commit ${SHA}"

  prepare_ea_version:
    name: Prepare EA Version
    if: needs.verify_ci.outputs.should_release == 'true'
    needs:
      - verify_ci
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      ea_version: ${{ steps.version.outputs.ea_version }}
      ea_tag: ${{ steps.version.outputs.ea_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify_ci.outputs.release_sha }}
          persist-credentials: false

      - name: Compute EA version
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # EA builds are prereleases of the next unreleased version:
          # max(package.json version, highest stable vX.Y.Z tag), patch-bumped
          # if that version has already shipped as stable.
          tags_file="${RUNNER_TEMP}/tags.txt"
          gh api --paginate "repos/${GH_REPO}/git/matching-refs/tags/v" --jq '.[].ref' > "${tags_file}"

          ea_version="$(node scripts/ea-version.mjs "${GITHUB_RUN_NUMBER}" "${tags_file}")"
          ea_tag="v${ea_version}"
          echo "EA version: ${ea_version}"
          echo "ea_version=${ea_version}" >> "${GITHUB_OUTPUT}"
          echo "ea_tag=${ea_tag}" >> "${GITHUB_OUTPUT}"

  create_ea_release:
    name: Create Draft EA Release
    needs:
      - verify_ci
      - prepare_ea_version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create draft Early Access release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.verify_ci.outputs.release_sha }}
          TAG_NAME: ${{ needs.prepare_ea_version.outputs.ea_tag }}
          EA_VERSION: ${{ needs.prepare_ea_version.outputs.ea_version }}
        run: |
          # The release stays a draft (invisible to update clients) until every
          # platform has built and uploaded its assets. The tag is created at
          # RELEASE_SHA when the draft is published.
          if gh release view "${TAG_NAME}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists"
          else
            gh release create "${TAG_NAME}" \
              --repo "${GH_REPO}" \
              --title "Early Access ${EA_VERSION}" \
              --prerelease \
              --draft \
              --target "${RELEASE_SHA}" \
              --generate-notes
          fi

  build_ea:
    name: Build EA ${{ matrix.platform_name }}
    needs:
      - verify_ci
      - prepare_ea_version
      - create_ea_release
    runs-on: ${{ matrix.os }}
    # Builds run dependency lifecycle scripts, so they only get read access.
    # Assets are handed to publish_ea as workflow artifacts.
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform_name: macOS
            build_command: bun run electron:build:mac:ea
          - os: windows-latest
            platform_name: Windows
            build_command: bun run electron:build:win:ea
          - os: ubuntu-latest
            platform_name: Linux
            build_command: bun run electron:build:linux:ea

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify_ci.outputs.release_sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set EA package version
        shell: bash
        env:
          EA_VERSION: ${{ needs.prepare_ea_version.outputs.ea_version }}
        run: |
          jq --arg version "${EA_VERSION}" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Build app
        run: ${{ matrix.build_command }}

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          while IFS= read -r file; do
            case "$(basename "$file")" in
              builder-debug.yml)
                continue
                ;;
            esac
            cp "$file" release-assets/
          done < <(find release -maxdepth 1 -type f | sort)

          if [ -z "$(ls -A release-assets)" ]; then
            echo "No release files found"
            exit 1
          fi
          ls -la release-assets

      - name: Upload release assets artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ea-assets-${{ matrix.platform_name }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 3

  publish_ea:
    name: Publish EA Release
    needs:
      - verify_ci
      - prepare_ea_version
      - build_ea
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify_ci.outputs.release_sha }}
          persist-credentials: false
          sparse-checkout: scripts

      # Download each platform by exact name: a pattern download succeeds with
      # whatever artifacts still exist, so an expired macOS or Windows artifact
      # would otherwise let a Linux-only re-run publish an incomplete release.
      - name: Download macOS release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ea-assets-macOS
          path: release-parts/macOS

      - name: Download Windows release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ea-assets-Windows
          path: release-parts/Windows

      - name: Download Linux release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ea-assets-Linux
          path: release-parts/Linux

      - name: Verify all platform assets are present
        run: >-
          node scripts/verify-release-assets.mjs
          --channel ea
          --out release-assets
          macOS=release-parts/macOS
          Windows=release-parts/Windows
          Linux=release-parts/Linux

      - name: Upload assets and publish Early Access release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare_ea_version.outputs.ea_tag }}
          EA_VERSION: ${{ needs.prepare_ea_version.outputs.ea_version }}
          RELEASE_SHA: ${{ needs.verify_ci.outputs.release_sha }}
        run: |
          # Recreate the draft if a previous attempt's cleanup deleted it and
          # only the failed jobs were re-run.
          if ! gh release view "${TAG_NAME}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" \
              --repo "${GH_REPO}" \
              --title "Early Access ${EA_VERSION}" \
              --prerelease \
              --draft \
              --target "${RELEASE_SHA}" \
              --generate-notes
          fi

          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < <(find release-assets -maxdepth 1 -type f | sort)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No release files found"
            exit 1
          fi

          gh release upload "${TAG_NAME}" "${files[@]}" --repo "${GH_REPO}" --clobber
          gh release edit "${TAG_NAME}" --repo "${GH_REPO}" --draft=false

  cleanup_ea_draft:
    name: Delete Orphaned EA Draft
    needs:
      - prepare_ea_version
      - create_ea_release
      - build_ea
      - publish_ea
    # Runs when the draft was created but a build or the publish step failed
    # or was cancelled, so no half-finished draft is left behind.
    if: >-
      always() &&
      needs.create_ea_release.result == 'success' &&
      needs.publish_ea.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Delete draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare_ea_version.outputs.ea_tag }}
        run: |
          is_draft="$(gh release view "${TAG_NAME}" --repo "${GH_REPO}" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "${is_draft}" = "true" ]; then
            gh release delete "${TAG_NAME}" --repo "${GH_REPO}" --yes
            echo "Deleted draft release ${TAG_NAME}"
          else
            echo "No draft release ${TAG_NAME} to delete (isDraft: ${is_draft:-missing})"
          fi
